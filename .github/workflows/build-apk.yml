name: Build and Publish Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          java -version
          echo "JAVA_HOME is $JAVA_HOME"
          JAVA_VERSION=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}' | awk -F '.' '{if ($1 == 1) print $2; else print $1}')
          if [ -z "$JAVA_VERSION" ]; then
            echo "Error: Could not detect Java version."
            exit 1
          fi
          if [ "$JAVA_VERSION" -lt 17 ]; then
            echo "Error: Java version is lower than 17 (detected $JAVA_VERSION)."
            exit 1
          fi
          echo "Java version $JAVA_VERSION confirmed."

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ ! -f ./debug.keystore ]; then
            keytool -genkey -v -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          if [ ! -f ./debug.keystore ]; then
            echo "Error: Keystore generation failed."
            exit 1
          fi

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify the APK
        run: |
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$EXPECTED_APK" ]; then
            echo "Error: Expected APK not found at $EXPECTED_APK."
            echo "Searching app/build/outputs/apk directory:"
            find app/build/outputs/apk -type f -name "*.apk" || echo "Directory not found or empty."
            exit 1
          fi
          if [ ! -s "$EXPECTED_APK" ]; then
            echo "Error: APK file is empty."
            exit 1
          fi

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          TEMP_DIR=$(mktemp -d)
          REPO_NAME=$(basename "${{ github.repository }}")
          SANITIZED_REPO=$(echo "$REPO_NAME" | tr -cd 'a-zA-Z0-9_-')
          RELEASE_ASSET_NAME="${SANITIZED_REPO}-debug-build-${{ github.run_number }}.apk"
          RELEASE_ASSET_PATH="${TEMP_DIR}/${RELEASE_ASSET_NAME}"
          cp app/build/outputs/apk/debug/app-debug.apk "$RELEASE_ASSET_PATH"
          echo "release_asset_path=$RELEASE_ASSET_PATH" >> $GITHUB_OUTPUT

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh --version
          RELEASE_ASSET="${{ steps.prepare_asset.outputs.release_asset_path }}"
          if [ ! -f "$RELEASE_ASSET" ] || [ ! -s "$RELEASE_ASSET" ]; then
             echo "Error: Release asset is missing or empty at $RELEASE_ASSET"
             exit 1
          fi
          TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          
          cat << 'EOF' > release_notes.txt
          This is an automatically generated debug APK.
          The APK was built by GitHub Actions.
          GitHub Actions run number: ${{ github.run_number }}
          GitHub Actions run attempt: ${{ github.run_attempt }}
          Source commit SHA: ${{ github.sha }}
          The APK is intended for testing.
          The APK is not a Play Store production release.
          The APK is signed only with a temporary debug keystore.
          EOF
          
          gh release create "$TAG" "$RELEASE_ASSET" \
            --title "Debug APK Build #${{ github.run_number }}" \
            --target "${{ github.sha }}" \
            --notes-file release_notes.txt \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ steps.publish_release.outcome }}" == "success" ]; then
            TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
            RELEASE_URL=$(gh release view "$TAG" --json url -q .url)
            echo "Release successful!"
            echo "Tag: $TAG"
            echo "Title: Debug APK Build #${{ github.run_number }}"
            echo "Release URL: $RELEASE_URL"
            echo "APK Asset Filename: $(basename "${{ steps.prepare_asset.outputs.release_asset_path }}")"
            
            echo "### ✅ Release Successful" >> $GITHUB_STEP_SUMMARY
            echo "The APK can be downloaded directly from the [GitHub Release Assets section]($RELEASE_URL)." >> $GITHUB_STEP_SUMMARY
            echo "The normal Actions artifact (\`app-debug-apk\`) is also available as a backup." >> $GITHUB_STEP_SUMMARY
          else
            echo "WARNING: Release publishing failed."
            echo "The APK build succeeded, but the GitHub Release could not be created."
            echo "The Actions artifact named 'app-debug-apk' remains available."
            
            echo "### ⚠️ Release Publishing Failed" >> $GITHUB_STEP_SUMMARY
            echo "The APK build succeeded, but the GitHub Release could not be created." >> $GITHUB_STEP_SUMMARY
            echo "The Actions artifact named \`app-debug-apk\` remains available for download." >> $GITHUB_STEP_SUMMARY
          fi
